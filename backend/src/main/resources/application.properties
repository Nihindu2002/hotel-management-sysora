spring.application.name=hotel-management

# Neon PostgreSQL. Set NEON_DATABASE_URL to the JDBC connection URL in the
# environment (local root .env is loaded by Docker Compose; export it for Maven).
spring.flyway.enabled=true
hotel.bootstrap-admin.email=${HOTEL_BOOTSTRAP_ADMIN_EMAIL:}
hotel.bootstrap-admin.password=${HOTEL_BOOTSTRAP_ADMIN_PASSWORD:}

# Tax applied to the discounted subtotal when a final bill is generated.
# Zero because the hotel is not currently registered for a room tax; raise this
# rather than editing BillingService if that changes.
hotel.tax.percentage=0

# Per-night supplements added to each room's nightly rate for board packages.
hotel.board-packages.premiums.room-only=0
hotel.board-packages.premiums.bed-and-breakfast=3000
hotel.board-packages.premiums.half-board=7000
hotel.board-packages.premiums.full-board=11000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# Development fallback only. Production should set GOOGLE_APPLICATION_CREDENTIALS.


server.port=${PORT:8080}

# Comma-separated browser origins permitted to call this API.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://hotel-management-sysora.vercel.app,https://hotel-management-sysora-*.vercel.app}
